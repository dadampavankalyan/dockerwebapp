version: "3.9"

services:
  devopsdb:
    image: pavankalyandadam/mynewapp:dbimage
    ports:
      - "1880:3306"
    deploy:
      replicas: 3
    networks:
      - mynetwork

  application:
    image: pavankalyandadam/mynewapp:appimage
    ports:
      - "1881:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
